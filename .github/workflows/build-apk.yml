name: Build APK

# Cada push a main compila el APK y lo publica como GitHub Release
# (versión 1.0.<run_number>), mismo patrón que nebula-mobile-client.
# La app no apunta a ningún servidor fijo: el usuario elige el suyo.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Por defecto instala "tools", que ya no existe en los cmdline-tools
      # recientes y hace fallar el paso; solo hace falta platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK/build-tools de Android (Capacitor 8 → API 36)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Calcular versión (1.0.<run_number>)
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fijar versionName/versionCode en build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle

      - name: Instalar dependencias npm
        run: npm ci

      - name: Tests de la pantalla de servidores
        run: npm test

      - name: cap sync android
        run: npx cap sync android

      - name: Compilar APK (debug — sin firma de Play Store)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/printflow-${{ steps.version.outputs.version }}.apk"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          files: dist/printflow-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
