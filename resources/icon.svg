<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0" stop-color="#2a2f6b"/>
      <stop offset="0.55" stop-color="#12142e"/>
      <stop offset="1" stop-color="#0b0d17"/>
    </radialGradient>
    <linearGradient id="layer" x1="0" x2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="770" cy="250" r="6" fill="#fff" opacity=".8"/>
  <circle cx="260" cy="820" r="4" fill="#fff" opacity=".5"/>
  <circle cx="840" cy="700" r="5" fill="#fff" opacity=".6"/>
  <!-- pieza impresa por capas -->
  <g transform="translate(512 560)">
    <rect x="-300" y="120" width="600" height="56" rx="28" fill="url(#layer)" opacity=".55"/>
    <rect x="-260" y="50"  width="520" height="56" rx="28" fill="url(#layer)" opacity=".7"/>
    <rect x="-220" y="-20" width="440" height="56" rx="28" fill="url(#layer)" opacity=".85"/>
    <rect x="-180" y="-90" width="360" height="56" rx="28" fill="url(#layer)"/>
  </g>
  <!-- boquilla -->
  <g transform="translate(512 300)">
    <rect x="-70" y="-120" width="140" height="110" rx="22" fill="#e8ebf5"/>
    <path d="M-44 -10 H44 L14 60 H-14 Z" fill="#e8ebf5"/>
    <circle cx="0" cy="90" r="14" fill="#8b5cf6"/>
  </g>
</svg>
